# Reusable workflow: the actual SSM deployment mechanics, called from
# order-pools-backend's own workflow via
#   uses: Abdulaziz-algharbi/order-pools-infrastructure/.github/workflows/deploy-backend.yml@main
#
# This exists so the "how do we get a build onto the EC2 instance"
# logic has exactly one implementation (mirroring backend/deploy-backend.sh
# and backend/deploy-remote.sh.tmpl), not a second copy pasted into the
# backend repo's own workflow. It does NOT build the application — that
# needs order-pools-backend's own source checked out, which naturally
# happens in the CALLING workflow, not here.
#
# Cross-repo reuse works here without a PAT/deploy key because reusable
# workflows (on: workflow_call) are specifically designed to be callable
# across private repos owned by the same account — unlike a plain
# `actions/checkout` of a different repo, which the default GITHUB_TOKEN
# can never do regardless of ownership.
name: Deploy backend (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      artifact_key:
        description: "S3 key (under the artifact bucket) of the release tarball the caller already uploaded"
        required: true
        type: string

# id-token: write is what lets this job request an OIDC token from
# GitHub at all — without it, aws-actions/configure-aws-credentials has
# nothing to exchange with AWS.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Declaring the SAME environment name the caller used is what makes
    # THIS job's own OIDC token carry the matching `environment` claim —
    # required because the backend-deploy IAM role's trust policy
    # (infrastructure/iam/02-github-oidc-roles.sh) checks that claim.
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout infrastructure (for deploy-remote.sh.tmpl)
        # `repository:` must be explicit here. actions/checkout@v4's
        # default (no `repository:` given) resolves `${{ github.repository }}`,
        # and inside a job that belongs to a CALLED reusable workflow,
        # that context reflects the CALLER's repo (order-pools-backend),
        # not the repo this workflow file itself lives in — confirmed
        # live: an earlier run without this checked out order-pools-backend
        # by default, which has no backend/deploy-remote.sh.tmpl at all,
        # so the render step failed with "no such file". This is a real,
        # non-obvious quirk of reusable workflows, not documentation
        # guesswork.
        uses: actions/checkout@v4
        with:
          repository: Abdulaziz-algharbi/order-pools-infrastructure

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve resource IDs from SSM Parameter Store
        id: resolve
        # These were written by backend/01-ec2-instance.sh,
        # backend/02-artifact-bucket.sh and backend/03-target-group.sh
        # under /order-pool/<env>/state/backend/... — the exact same
        # values your laptop would read via lib/state.sh's get_output.
        run: |
          set -Eeuo pipefail
          PATH_PREFIX="/order-pool/${{ inputs.environment }}/state/backend"
          {
            echo "instance_id=$(aws ssm get-parameter --name "${PATH_PREFIX}/instance-id" --query Parameter.Value --output text)"
            echo "tg_arn=$(aws ssm get-parameter --name "${PATH_PREFIX}/target-group-arn" --query Parameter.Value --output text)"
            echo "bucket=$(aws ssm get-parameter --name "${PATH_PREFIX}/artifact-bucket-name" --query Parameter.Value --output text)"
          } >> "$GITHUB_OUTPUT"

      - name: Render the remote deploy script
        # Identical placeholder substitution to backend/deploy-backend.sh
        # — same template, same mechanism, just invoked from a runner
        # instead of a laptop.
        run: |
          sed \
            -e "s|__PROJECT__|order-pool|g" \
            -e "s|__ENVIRONMENT__|${{ inputs.environment }}|g" \
            -e "s|__BACKEND_PORT__|${{ vars.BACKEND_PORT }}|g" \
            -e "s|__ARTIFACT_BUCKET__|${{ steps.resolve.outputs.bucket }}|g" \
            -e "s|__ARTIFACT_KEY__|${{ inputs.artifact_key }}|g" \
            -e "s|__AWS_REGION__|${{ vars.AWS_REGION }}|g" \
            backend/deploy-remote.sh.tmpl > /tmp/deploy-remote.sh

      - name: Send the deployment command via SSM (no SSH involved)
        id: send
        run: |
          set -Eeuo pipefail
          COMMANDS_JSON=$(jq -n --arg script "$(cat /tmp/deploy-remote.sh)" '{commands: [$script]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.resolve.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "order-pool ${{ inputs.environment }} backend deploy (GitHub Actions run ${{ github.run_id }}, ${{ github.sha }})" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for the remote script to finish
        run: |
          set -Eeuo pipefail
          INSTANCE_ID="${{ steps.resolve.outputs.instance_id }}"
          COMMAND_ID="${{ steps.send.outputs.command_id }}"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "--- remote stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "--- remote stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Remote deployment script finished with status: $STATUS"
            exit 1
          fi

      - name: Wait for the ALB target group to report healthy
        run: |
          set -Eeuo pipefail
          TG_ARN="${{ steps.resolve.outputs.tg_arn }}"
          INSTANCE_ID="${{ steps.resolve.outputs.instance_id }}"
          for _ in $(seq 1 20); do
            HEALTH=$(aws elbv2 describe-target-health --target-group-arn "$TG_ARN" --targets "Id=${INSTANCE_ID}" \
              --query 'TargetHealthDescriptions[0].TargetHealth.State' --output text)
            if [ "$HEALTH" == "healthy" ]; then
              echo "Target is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Target group never reported healthy within 100s (last state: $HEALTH)"
          exit 1
